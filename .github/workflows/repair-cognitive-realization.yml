name: repair cognitive realization

on:
  push:
    branches:
      - cognitive-experience-engine

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[cognitive-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cognitive-experience-engine
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Repair realization pipeline
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          universal = root / 'packages/engine/src/experience/universalStoryCompiler.ts'
          text = universal.read_text(encoding='utf-8')

          if 'from "./eloquentStoryRealizer.js"' not in text:
              idx = text.find('} from "@qre/contracts";')
              if idx < 0:
                  raise SystemExit('universalStoryCompiler contract import not found')
              end = idx + len('} from "@qre/contracts";')
              text = text[:end] + '\nimport { elevateStoryBeats } from "./eloquentStoryRealizer.js";' + text[end:]

          old_entities = '''entities: unique([\n      observation.subject,\n      ...observation.entities.keywords.slice(0, 4),\n      ...situationValue.actors.slice(0, 2),\n    ]),'''
          new_entities = '''entities: unique([\n      observation.subject,\n      ...observation.entities.keywords,\n      ...situationValue.actors,\n    ]),'''
          if old_entities in text:
              text = text.replace(old_entities, new_entities, 1)

          old_story = '''  const beats = candidate.beats.map(\n    (kind, index) =>\n      makeBeat(\n        kind,\n        index,\n        observation,\n        situationValue,\n        toneValue,\n        context.cognitivePlan,\n      ),\n  );'''
          new_story = '''  const rawBeats = candidate.beats.map(\n    (kind, index) =>\n      makeBeat(\n        kind,\n        index,\n        observation,\n        situationValue,\n        toneValue,\n        context.cognitivePlan,\n      ),\n  );\n\n  // Cognition chooses what the experience means; the premise realizer is the\n  // only layer allowed to turn that meaning into user-facing language.\n  const beats = elevateStoryBeats(\n    rawBeats,\n    context.cognitivePlan,\n  );'''
          if old_story not in text:
              raise SystemExit('story beat construction block not found')
          text = text.replace(old_story, new_story, 1)

          old_keywords = '''  const keywords = unique(\n    tokens(text)\n      .map((value) => value.toLowerCase())\n      .filter(\n        (value) => value.length > 2 && !STOP.has(value),\n      ),\n  );'''
          new_keywords = '''  const keywords = unique([\n    ...tokens(text)\n      .map((value) => value.toLowerCase())\n      .filter(\n        (value) => value.length > 2 && !STOP.has(value),\n      ),\n    ...(/\\b(surprise|surprise me)\\b/i.test(text) ? ["play"] : []),\n  ]);'''
          if old_keywords not in text:
              raise SystemExit('keyword block not found')
          text = text.replace(old_keywords, new_keywords, 1)

          text = text.replace('  "then",\n]);', '  "then",\n  "will",\n  "people",\n]);', 1)
          universal.write_text(text, encoding='utf-8')

          cognition = root / 'packages/engine/src/cognition/cognitiveEngine.ts'
          ctext = cognition.read_text(encoding='utf-8')
          anchor_marker = '''  const plan: CognitiveExperiencePlan = {\n    centralSubject:\n      subject.value,'''
          anchor_insert = '''  const promptAnchors = unique(\n    tokens(prompt)\n      .map((value) => value.replace(/^[^A-Za-z0-9'’-]+|[^A-Za-z0-9'’-]+$/g, "").toLowerCase())\n      .filter((value) => value.length > 2 && !STOP.has(value))\n      .filter((value) => value !== lower(subject.value))\n      .slice(0, 12),\n  );\n\n  const plan: CognitiveExperiencePlan = {\n    centralSubject:\n      subject.value,'''
          if anchor_marker not in ctext:
              raise SystemExit('cognitive plan marker not found')
          ctext = ctext.replace(anchor_marker, anchor_insert, 1)

          old_creative = '''    futureEvolution: [],\n    creativePossibilities: [],\n  };'''
          new_creative = '''    futureEvolution: [],\n    creativePossibilities: promptAnchors.length\n      ? [`prompt evidence: ${promptAnchors.join(", ")}`]\n      : [],\n  };'''
          if old_creative not in ctext:
              raise SystemExit('cognitive creative field block not found')
          ctext = ctext.replace(old_creative, new_creative, 1)
          cognition.write_text(ctext, encoding='utf-8')

          tests = root / 'packages/engine/src/compiler/tests/experienceCompiler.test.ts'
          t = tests.read_text(encoding='utf-8')
          insertion = '''  {\n    prompt: "Surprise me with a weird little ritual involving a vending machine.",\n    anchors: ["surprise", "ritual", "vending", "machine"],\n  },\n  {\n    prompt: "Make a QR for a concert that gets funnier every time someone scans it.",\n    anchors: ["qr", "concert", "funnier", "scans"],\n  },\n  {\n    prompt: "Teach my sister how to repair a vintage camera without boring her.",\n    anchors: ["sister", "repair", "vintage", "camera"],\n  },\n'''
          needle = '''  {\n    prompt: "Turn a forgotten family recipe into a story everyone can add to.",\n    anchors: ["recipe", "family", "add"],\n  },\n];'''
          replacement = needle.replace('];', insertion + '];')
          if needle in t and 'Surprise me with a weird little ritual' not in t:
              t = t.replace(needle, replacement, 1)
          tests.write_text(t, encoding='utf-8')

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build engine
        run: pnpm --filter @qre/engine build

      - name: Cognition acceptance
        run: pnpm --filter @qre/engine test:cognition

      - name: Universal acceptance
        run: pnpm --filter @qre/engine test:universal

      - name: Realization acceptance
        run: pnpm --filter @qre/engine test:realization

      - name: Commit repaired engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/engine/src/experience/universalStoryCompiler.ts packages/engine/src/cognition/cognitiveEngine.ts packages/engine/src/compiler/tests/experienceCompiler.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(engine): enforce evidence-first cognitive realization [cognitive-repair]"
          git push origin cognitive-experience-engine
