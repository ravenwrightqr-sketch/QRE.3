name: QRE CI

on:
  push:
    branches:
      - main
      - rebuild/author-final
      - rebuild/author-complete-final
  pull_request:

concurrency:
  group: qre-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify canonical Author
        run: pnpm author:guard
      - name: Generate Prisma client
        run: pnpm --filter @qre/db prisma:generate
      - name: Build contracts
        run: pnpm build:contracts
      - name: Build database
        run: pnpm build:db
      - name: Build engine
        run: pnpm build:engine
      - name: Build API
        run: pnpm build:api
      - name: Build web
        run: pnpm build:web
