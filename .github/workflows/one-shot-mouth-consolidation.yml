name: one-shot-mouth-consolidation

on:
  push:
    branches:
      - audit/mouth-production-sync

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.head_commit.message != 'chore: add one-shot Mouth consolidation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Run one-shot consolidation
        run: node scripts/.one-shot-consolidate-mouth-production.mjs
      - name: Typecheck contracts
        run: pnpm --filter @qre/contracts build
      - name: Typecheck engine
        run: pnpm --filter @qre/engine build
      - name: Commit consolidation
        run: |
          git config user.name "qre-mouth-consolidation[bot]"
          git config user.email "qre-mouth-consolidation[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: consolidate canonical Mouth generation ownership"
          git push origin HEAD:audit/mouth-production-sync
