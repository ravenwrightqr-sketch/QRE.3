name: QRE Author Domain Context Once

on:
  push:
    branches:
      - supplied-media-sequence-convergence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supplied-media-sequence-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical context wiring
        run: node scripts/patch-author-domain-context-v2.mjs
