name: one-time-super-cog-realization-patch

on:
  push:
    branches:
      - transformation-super-compiler

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: transformation-super-compiler

      - name: Apply narrative-attention patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/engine/src/experience/universalStoryCompiler.ts')
          text = path.read_text(encoding='utf-8-sig')

          marker = '''function candidates(\n  observation: ExperienceObservation,\n  situationValue: StorySituation,\n  plan?: CognitiveExperiencePlan,\n): Candidate[] {'''

          helper = r'''/**
           * Compresses internal cognitive operations into observable narrative
           * attention. A trajectory may contain many reasoning operations, but
           * customer prose should only surface the operations that actually
           * change attention or state.
           *
           * This is deliberately domain-neutral. It is not a story template.
           */
          function compressCognitiveTrajectory(
            beats: StoryBeatKind[],
            observation: ExperienceObservation,
            plan?: CognitiveExperiencePlan,
          ): StoryBeatKind[] {
            if (beats.length <= 7) return [...beats];

            const phases: Array<{
              name: string;
              kinds: StoryBeatKind[];
              required?: boolean;
            }> = [
              {
                name: "entry",
                kinds: ["orientation", "hook", "threshold", "origin", "need"],
                required: true,
              },
              {
                name: "event",
                kinds: ["encounter", "action", "challenge", "instruction", "contribution"],
                required: true,
              },
              {
                name: "turn",
                kinds: ["discovery", "reveal", "feedback", "escalation"],
                required: true,
              },
              {
                name: "change",
                kinds: ["transformation", "identity", "milestone"],
              },
              {
                name: "close",
                kinds: ["payoff", "reflection"],
                required: true,
              },
              {
                name: "continuation",
                kinds: ["continuation", "next_step"],
              },
            ];

            const selected: StoryBeatKind[] = [];
            const used = new Set<StoryBeatKind>();

            for (const phase of phases) {
              const found = beats.find(
                (kind) => phase.kinds.includes(kind) && !used.has(kind),
              );

              if (found) {
                selected.push(found);
                used.add(found);
              }
            }

            // A second observable event is valuable when the trajectory has
            // enough distinct evidence to support it. This is where comedy,
            // surprise, or a concrete middle action can breathe without
            // turning every internal operation into a sentence.
            const evidenceRich =
              observation.entities.keywords.length >= 4 ||
              Boolean(plan?.premise?.slots.length && plan.premise.slots.length >= 4);

            if (evidenceRich && selected.length < 7) {
              const extra = beats.find(
                (kind) =>
                  ["action", "encounter", "challenge", "discovery", "reveal", "feedback", "escalation"]
                    .includes(kind) &&
                  !used.has(kind),
              );

              if (extra) {
                const closeIndex = selected.findIndex(
                  (kind) => kind === "payoff" || kind === "reflection",
                );

                if (closeIndex >= 0) {
                  selected.splice(closeIndex, 0, extra);
                } else {
                  selected.push(extra);
                }
                used.add(extra);
              }
            }

            // Continuation is a semantic capability, not a mandatory ending.
            // Only surface it when the plan actually supports future growth.
            if (!plan?.futureEvolution?.length && !plan?.memoryModel?.length) {
              return selected.filter((kind) => kind !== "continuation" && kind !== "next_step");
            }

            return selected.slice(0, 7);
          }

          '''

          if 'function compressCognitiveTrajectory(' not in text:
              if marker not in text:
                  raise SystemExit('universalStoryCompiler marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''    const cognitiveTrajectory = composeCognitiveTrajectory({\n  plan,\n});\n\nif (cognitiveTrajectory.beats.length) {\n  pool.push([\n    "cognitive-derived",\n    cognitiveTrajectory.beats,'''

          new = '''    const cognitiveTrajectory = composeCognitiveTrajectory({\n  plan,\n});\n\nconst narrativeBeats = compressCognitiveTrajectory(\n  cognitiveTrajectory.beats,\n  observation,\n  plan,\n);\n\nif (narrativeBeats.length) {\n  pool.push([\n    "cognitive-derived",\n    narrativeBeats,'''

          if old not in text:
              raise SystemExit('cognitive candidate block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          super_path = Path('packages/engine/src/experience/superStoryRealizer.ts')
          super_text = super_path.read_text(encoding='utf-8-sig')
          old_signal = '''    ...(plan?.realization?.semanticArc ?? []),\n    ...(plan?.realization?.directives.flatMap((item) => [\n      item.action,\n      item.intent,\n      item.stateBefore,\n      item.stateAfter,\n    ]) ?? []),\n    ...premiseValues(plan, "emotion"),'''
          new_signal = '''    ...(plan?.realization?.semanticArc ?? []),\n    ...(plan?.realization?.directives.flatMap((item) => [\n      item.action,\n      item.intent,\n      item.stateBefore,\n      item.stateAfter,\n    ]) ?? []),\n    ...premiseValues(plan, "emotion"),\n    ...(plan?.premise?.slots.flatMap((slot) => slot.values) ?? []),'''
          if old_signal in super_text and new_signal not in super_text:
              super_text = super_text.replace(old_signal, new_signal, 1)
              super_path.write_text(super_text, encoding='utf-8')

      - name: Verify the patch is structurally present
        shell: bash
        run: |
          grep -q "compressCognitiveTrajectory" packages/engine/src/experience/universalStoryCompiler.ts
          grep -q 'premise?.slots.flatMap' packages/engine/src/experience/superStoryRealizer.ts

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_super_cog_realization_patch.yml
          git add packages/engine/src/experience/universalStoryCompiler.ts packages/engine/src/experience/superStoryRealizer.ts
          git commit -m "fix: separate cognitive trajectory from narrative attention"
          git push origin HEAD:transformation-super-compiler
